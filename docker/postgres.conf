# ==============================================================================
# TCT AnsiblePulse - Production-Tuned PostgreSQL 16 Configuration
# Optimized for high-throughput YAML AST analysis, JSONB GIN parameter searches,
# and dependency DAG path traversals.
# ==============================================================================

# Connectivity & Connections
listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 3

# Memory Allocation (Lean & high performance for containerized WSL)
shared_buffers = 128MB                  # Lightweight buffer cache
effective_cache_size = 384MB
work_mem = 8MB                          # Fast for JSONB set aggregations
maintenance_work_mem = 32MB
wal_buffers = 8MB                       # Dedicated WAL buffer

# Query Planner & NVMe/SSD Optimizations
random_page_cost = 1.1                  # SSD / NVMe optimized
effective_io_concurrency = 200          # Concurrent asynchronous I/O
default_statistics_target = 100         # Robust statistics for query planner

# Write-Ahead Log (WAL) & Checkpoints
checkpoint_completion_target = 0.9      # Smooth I/O spikes over checkpoint interval
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_timeout = 15min

# Logging & Observability
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 250        # Log slow queries taking > 250ms
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '

# Locale & Encoding
client_encoding = 'UTF8'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
