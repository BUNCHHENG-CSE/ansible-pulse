services:
  postgres:
    image: postgres:16-alpine
    container_name: ansiblepulse_postgres
    restart: unless-stopped
    shm_size: 256mb
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ansible_pulse}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ansiblepulse_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - ./docker/postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ansible_pulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M

volumes:
  ansiblepulse_pgdata:
    name: ansiblepulse_pgdata
